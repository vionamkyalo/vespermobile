name: insyte_mobile
description: "Vesper patrol officer app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi_web: ^1.2.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+2
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  provider: ^6.1.5+1
  uuid: ^4.6.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#122B59"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/